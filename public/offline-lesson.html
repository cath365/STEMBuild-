<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#07111f" />
  <title>STEMBuild Offline Lesson</title>
  <style>
    :root{color-scheme:dark;--bg:#07111f;--surface:#0e1b2e;--surface2:#14233a;--border:#263a56;--text:#f5f8fc;--muted:#9eb0c8;--primary:#40d99c;--warning:#ffc857}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif;line-height:1.6}.wrap{width:min(920px,calc(100% - 28px));margin:0 auto;padding:20px 0 48px}.bar{display:flex;gap:12px;justify-content:space-between;align-items:center;position:sticky;top:0;background:rgba(7,17,31,.96);padding:12px 0;z-index:2}.badge{display:inline-flex;padding:5px 9px;border-radius:999px;border:1px solid var(--border);background:var(--surface2);font-size:12px;font-weight:700}.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:18px;margin:14px 0}.muted{color:var(--muted)}.notice{border:1px solid #5d4b1a;background:#2b2411;color:#ffdc7d;border-radius:12px;padding:12px}.btn{border:1px solid var(--border);background:var(--surface2);color:var(--text);border-radius:10px;padding:10px 14px;font-weight:700}.primary{background:var(--primary);color:#06141c;border-color:transparent}textarea{width:100%;min-height:100px;border-radius:10px;background:#091729;color:var(--text);border:1px solid var(--border);padding:10px;margin-top:6px}pre{white-space:pre-wrap;overflow:auto;background:#050b13;border:1px solid var(--border);padding:12px;border-radius:10px}.grid{display:grid;gap:12px}.checks{display:flex;gap:10px;flex-wrap:wrap}.check{display:flex;align-items:center;gap:6px;padding:7px 9px;background:var(--surface2);border-radius:10px}.status-online{color:#82efc4}.status-offline{color:#ffd978}a{color:inherit}@media(max-width:640px){.bar{align-items:flex-start;flex-direction:column}.btn{width:100%}}
  </style>
</head>
<body>
  <main class="wrap">
    <div class="bar"><strong>STEMBuild Offline Lesson</strong><span id="status" class="badge">Checking connection…</span></div>
    <div id="message" class="notice" hidden></div>
    <div id="lesson"></div>
  </main>
<script>
const DB_NAME="stembuild_offline_v1",DB_VERSION=2,OWNER_KEY="stembuild_active_learner";
function openDb(){return new Promise((resolve,reject)=>{const r=indexedDB.open(DB_NAME,DB_VERSION);r.onupgradeneeded=()=>{const db=r.result;if(!db.objectStoreNames.contains("lessons"))db.createObjectStore("lessons",{keyPath:"key"});if(!db.objectStoreNames.contains("drafts"))db.createObjectStore("drafts",{keyPath:"key"});if(!db.objectStoreNames.contains("queue"))db.createObjectStore("queue",{keyPath:"id"});if(!db.objectStoreNames.contains("meta"))db.createObjectStore("meta",{keyPath:"key"})};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
function req(r){return new Promise((resolve,reject)=>{r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
async function get(store,key){const db=await openDb(),tx=db.transaction(store,"readonly"),value=await req(tx.objectStore(store).get(key));db.close();return value}
async function getAll(store){const db=await openDb(),tx=db.transaction(store,"readonly"),value=await req(tx.objectStore(store).getAll());db.close();return value}
async function put(store,value){const db=await openDb(),tx=db.transaction(store,"readwrite");await req(tx.objectStore(store).put(value));db.close()}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]))}
function status(){const el=document.getElementById("status");el.textContent=navigator.onLine?"Online":"Offline · local mode";el.className="badge "+(navigator.onLine?"status-online":"status-offline")}
async function queue(ownerId,payload){await put("queue",{id:crypto.randomUUID(),ownerId,type:"CHECKPOINT_UPSERT",payload});if("serviceWorker" in navigator){const reg=await navigator.serviceWorker.ready;try{await reg.sync?.register("stembuild-offline-sync")}catch{}reg.active?.postMessage({type:"SYNC_NOW"})}}
async function saveDraft(ownerId,lessonId,taskId){const prefix=taskId?`task-${taskId}`:"lesson";const ids=["objective","theory","hardware","practical","safety"];const completedSections=ids.filter(id=>document.getElementById(prefix+"-"+id)?.checked);const notes=document.getElementById(prefix+"-notes")?.value||"";const codeDraft=document.getElementById(prefix+"-code")?.value||"";const troubleshooting=document.getElementById(prefix+"-troubleshooting")?.value||"";const clientUpdatedAt=new Date().toISOString();const draft={key:`${ownerId}:${lessonId}:${taskId||"lesson"}`,ownerId,lessonId,practicalTaskId:taskId||null,completedSections,notes,codeDraft,troubleshooting,clientUpdatedAt};await put("drafts",draft);await queue(ownerId,{lessonId,practicalTaskId:taskId||null,completedSections,notes,codeDraft,troubleshooting,clientUpdatedAt});const msg=document.getElementById("message");msg.hidden=false;msg.textContent=navigator.onLine?"Saved locally. STEMBuild will synchronize this checkpoint shortly.":"Saved on this device. STEMBuild will synchronize when this learner reconnects and is signed in."}
async function restoreDraft(ownerId,lessonId,taskId){const prefix=taskId?`task-${taskId}`:"lesson",draft=await get("drafts",`${ownerId}:${lessonId}:${taskId||"lesson"}`);if(!draft)return;for(const section of draft.completedSections||[]){const box=document.getElementById(prefix+"-"+section);if(box)box.checked=true}const fields=[["notes",draft.notes],["code",draft.codeDraft],["troubleshooting",draft.troubleshooting]];for(const [suffix,value] of fields){const el=document.getElementById(prefix+"-"+suffix);if(el)el.value=value||""}}
function checklist(prefix){return `<div class="checks">${["objective","theory","hardware","practical","safety"].map(x=>`<label class="check"><input id="${prefix}-${x}" type="checkbox"> ${x}</label>`).join("")}</div>`}
(async()=>{status();addEventListener("online",status);addEventListener("offline",status);const ownerId=localStorage.getItem(OWNER_KEY);const lessonId=new URL(location.href).searchParams.get("lesson");const root=document.getElementById("lesson"),message=document.getElementById("message");if(!ownerId){message.hidden=false;message.textContent="No active learner is selected on this shared device. Sign in online before opening private offline drafts.";return}if(!lessonId){const saved=(await getAll("lessons")).filter(item=>item.ownerId===ownerId);if(!saved.length){message.hidden=false;message.textContent="No lessons have been downloaded for the current learner yet.";return}root.innerHTML=`<section class="card"><h1>Downloaded lessons</h1><p class="muted">These lesson packages are stored only for the active learner on this device.</p>${saved.map(item=>`<p><a class="btn" href="/offline-lesson.html?lesson=${encodeURIComponent(item.lessonId)}">${esc(item.title)} · ${esc(item.moduleTitle)}</a></p>`).join("")}</section>`;return}const lesson=await get("lessons",`${ownerId}:${lessonId}`);if(!lesson){message.hidden=false;message.textContent="This lesson has not been downloaded for the current learner.";return}root.innerHTML=`
<section class="card"><div class="muted">${esc(lesson.courseTitle)} · ${esc(lesson.moduleTitle)}</div><h1>${esc(lesson.title)}</h1><div class="badge">${esc(lesson.difficulty)} · ~${esc(lesson.estimatedMinutes)} min</div></section>
<section class="card"><h2>Learning objective</h2><p>${esc(lesson.objective)}</p><h3>Theory</h3><p>${esc(lesson.theory)}</p></section>
<div class="notice"><strong>Safety:</strong> ${esc(lesson.safetyNotes)}</div>
<section class="card"><h2>Hardware instructions</h2>${lesson.hardwareVariants.map(v=>`<details><summary><strong>${esc(v.hardwarePlatform)}</strong></summary><h3>Components</h3><ul>${v.components.map(c=>`<li>${esc(c.quantity)}× ${esc(c.name)} ${c.notes?"— "+esc(c.notes):""}</li>`).join("")||"<li>No additional components listed.</li>"}</ul><h3>Wiring</h3><p>${esc(v.wiringInstructions)}</p><h3>Starter code</h3><pre>${esc(v.codeSnippet)}</pre><h3>Expected output</h3><p>${esc(v.expectedOutput)}</p><h3>Troubleshooting</h3><p>${esc(v.troubleshooting)}</p></details>`).join("")}</section>
<section class="card"><h2>Practical challenge</h2><p>${esc(lesson.practicalChallenge)}</p><p class="muted"><strong>Expected result:</strong> ${esc(lesson.expectedOutput)}</p></section>
<section class="card"><h2>Offline reading checkpoint</h2>${checklist("lesson")}<label>Private lesson notes<textarea id="lesson-notes" placeholder="Notes for yourself"></textarea></label><button class="btn primary" id="save-lesson">Save checkpoint</button></section>
${lesson.practicalTasks.map(t=>`<section class="card"><h2>${esc(t.title)}</h2><p>${esc(t.instructions)}</p><p><strong>Success criteria:</strong> ${esc(t.successCriteria)}</p><p class="muted">${esc(t.evidencePrompt)}</p>${checklist("task-"+t.id)}<label>Build notes<textarea id="task-${t.id}-notes"></textarea></label><label>Code draft<textarea id="task-${t.id}-code"></textarea></label><label>Troubleshooting<textarea id="task-${t.id}-troubleshooting"></textarea></label><button class="btn primary" data-save-task="${t.id}">Save unfinished work</button><p class="muted">Final evidence upload and assessment submission require an online authenticated session.</p></section>`).join("")}
<section class="card"><strong>Offline boundary</strong><p class="muted">Quizzes, final evidence submission, AI Lab Coach and teacher assessment stay online to protect assessment integrity and student data.</p></section>`;
document.getElementById("save-lesson").onclick=()=>saveDraft(ownerId,lessonId,null);for(const button of document.querySelectorAll("[data-save-task]"))button.onclick=()=>saveDraft(ownerId,lessonId,button.dataset.saveTask);await restoreDraft(ownerId,lessonId,null);for(const task of lesson.practicalTasks)await restoreDraft(ownerId,lessonId,task.id);})();
</script>
</body>
</html>
