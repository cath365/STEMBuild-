<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07111f"><title>STEMBuild Offline Lesson</title><style>body{margin:0;background:#07111f;color:#f5f8fc;font:16px Arial;line-height:1.6}.wrap{max-width:900px;margin:auto;padding:20px}.card{background:#0e1b2e;border:1px solid #263a56;border-radius:14px;padding:16px;margin:14px 0}.muted{color:#9eb0c8}.btn{display:inline-block;background:#14233a;color:#fff;border:1px solid #263a56;border-radius:9px;padding:10px 14px;margin:5px}textarea{width:100%;min-height:90px;background:#091729;color:#fff;border:1px solid #263a56;border-radius:8px;padding:8px}pre{white-space:pre-wrap;overflow:auto;background:#050b13;padding:12px;border-radius:8px}</style></head><body><main class="wrap"><h2>STEMBuild Offline Lesson</h2><p id="status" class="muted"></p><div id="msg"></div><div id="root"></div></main><script>
const DB="stembuild_offline_v1",V=2,OWNER="stembuild_active_learner";function openDb(){return new Promise((a,b)=>{const r=indexedDB.open(DB,V);r.onupgradeneeded=()=>{for(const [n,o] of [["lessons","key"],["drafts","key"],["queue","id"],["meta","key"]])if(!r.result.objectStoreNames.contains(n))r.result.createObjectStore(n,{keyPath:o})};r.onsuccess=()=>a(r.result);r.onerror=()=>b(r.error)})}function req(r){return new Promise((a,b)=>{r.onsuccess=()=>a(r.result);r.onerror=()=>b(r.error)})}async function get(s,k){const d=await openDb(),t=d.transaction(s,"readonly"),v=await req(t.objectStore(s).get(k));d.close();return v}async function put(s,v){const d=await openDb(),t=d.transaction(s,"readwrite");await req(t.objectStore(s).put(v));d.close()}function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}function state(){status.textContent=navigator.onLine?"Online":"Offline · local work stays on this device"}state();addEventListener("online",state);addEventListener("offline",state);
async function save(owner,lesson,task){const notes=document.getElementById("notes-"+task)?.value||"",codeDraft=document.getElementById("code-"+task)?.value||"",troubleshooting=document.getElementById("debug-"+task)?.value||"",clientUpdatedAt=new Date().toISOString(),payload={lessonId:lesson,practicalTaskId:task==="lesson"?null:task,completedSections:["objective","theory","hardware","practical","safety"],notes,codeDraft,troubleshooting,clientUpdatedAt};await put("drafts",{key:owner+":"+lesson+":"+task,ownerId:owner,...payload});await put("queue",{id:crypto.randomUUID(),ownerId:owner,type:"CHECKPOINT_UPSERT",payload});msg.innerHTML='<div class="card">Saved locally. It will synchronize when this learner reconnects while signed in.</div>';if("serviceWorker"in navigator)(await navigator.serviceWorker.ready).active?.postMessage({type:"SYNC_NOW"})}
(async()=>{const owner=localStorage.getItem(OWNER),id=new URL(location.href).searchParams.get("lesson");if(!owner||!id){msg.innerHTML='<div class="card">Sign in online and download a lesson first.</div>';return}const l=await get("lessons",owner+":"+id);if(!l){msg.innerHTML='<div class="card">This lesson is not downloaded for the current learner.</div>';return}root.innerHTML='<div class="card"><div class="muted">'+esc(l.courseTitle)+' · '+esc(l.moduleTitle)+'</div><h1>'+esc(l.title)+'</h1><h3>Objective</h3><p>'+esc(l.objective)+'</p><h3>Theory</h3><p>'+esc(l.theory)+'</p><p><strong>Safety:</strong> '+esc(l.safetyNotes)+'</p></div><div class="card"><h2>Hardware</h2>'+l.hardwareVariants.map(v=>'<details><summary><strong>'+esc(v.hardwarePlatform)+'</strong></summary><p>'+esc(v.wiringInstructions)+'</p><pre>'+esc(v.codeSnippet)+'</pre><p>'+esc(v.troubleshooting)+'</p></details>').join("")+'</div><div class="card"><h2>Practical challenge</h2><p>'+esc(l.practicalChallenge)+'</p></div>'+l.practicalTasks.map(t=>'<div class="card"><h2>'+esc(t.title)+'</h2><p>'+esc(t.instructions)+'</p><label>Build notes<textarea id="notes-'+t.id+'"></textarea></label><label>Code draft<textarea id="code-'+t.id+'"></textarea></label><label>Troubleshooting<textarea id="debug-'+t.id+'"></textarea></label><button class="btn" data-save="'+t.id+'">Save unfinished work</button><p class="muted">Final evidence and assessment require an online session.</p></div>').join("");for(const b of document.querySelectorAll("[data-save]"))b.onclick=()=>save(owner,id,b.dataset.save)})();
</script></body></html>
