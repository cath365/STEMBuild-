name: Bootstrap STEMBuild source

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bootstrap.yml"

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Reconstruct and verify source archive
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/part-*.txt > /tmp/stembuild.b64
          base64 --decode /tmp/stembuild.b64 > /tmp/stembuild.zip
          unzip -tq /tmp/stembuild.zip

      - name: Import STEMBuild source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/stembuild-import
          mkdir -p /tmp/stembuild-import
          unzip -q /tmp/stembuild.zip -d /tmp/stembuild-import
          test -f /tmp/stembuild-import/stembuild/package.json
          rsync -a --exclude=".git" --exclude=".github" /tmp/stembuild-import/stembuild/ ./
          rm -rf .bootstrap

      - name: Commit imported MVP
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: import STEMBuild Robotics and IoT MVP"
          git push

# Triggered after archive verification on 2026-10-02.
