services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: stembuild
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - stembuild_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d stembuild"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  stembuild_pgdata:
